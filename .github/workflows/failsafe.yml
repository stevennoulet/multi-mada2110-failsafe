name: Licence failsafe
on:
  schedule:
    - cron: "23 9 * * *"      # every day, 09:23 UTC
  workflow_dispatch:          # Actions → Licence failsafe → Run workflow (a check now; YES = publish now)
    inputs:
      publish_now:
        description: "Type YES to publish the unlock NOW (cannot be undone in the apps)"
        required: false
        default: "no"
permissions:
  contents: write
concurrency: failsafe
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the licence server's heartbeat
        env:
          UNLOCK: ${{ secrets.FAILSAFE_UNLOCK }}
          DAYS: "45"
          WARN_DAYS: "30"
          PUBLISH_NOW: ${{ github.event.inputs.publish_now }}
        run: bash failsafe.sh
